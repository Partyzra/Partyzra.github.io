  <div class="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Photo viewer" data-lightbox>
    <div class="lightbox-topbar">
      <div class="lightbox-index" aria-live="polite" data-lightbox-index></div>
      <button class="icon-button" type="button" aria-label="Close photo viewer" data-lightbox-close>×</button>
    </div>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photo" data-lightbox-prev>‹</button>
    <div class="lightbox-stage" data-lightbox-stage>
      <div class="lightbox-slide lightbox-slide-prev" aria-hidden="true"><img alt=""></div>
      <div class="lightbox-slide lightbox-slide-current"><img data-lightbox-image alt=""></div>
      <div class="lightbox-slide lightbox-slide-next" aria-hidden="true"><img alt=""></div>
    </div>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photo" data-lightbox-next>›</button>
    <div class="lightbox-footer">
      <p data-lightbox-caption></p>
      <p class="lightbox-hint">Swipe, drag, or use ← →</p>
    </div>
  </div>

  <footer class="site-footer">
