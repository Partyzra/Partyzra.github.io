<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photography portfolio by Ryan.">
  <meta name="theme-color" content="#090a0b">
  <title>Photography — Ryan</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site-shell.css">
</head>
<body class="site-shell-page">
  <iframe class="site-shell-frame" data-site-shell-frame src="photography-content.html" title="Ryan photography portfolio"></iframe>

  <audio class="site-soundtrack-audio" data-site-soundtrack preload="metadata"></audio>
  <div class="site-soundtrack-player" aria-label="Site soundtrack controls">
    <button class="site-soundtrack-control" type="button" data-soundtrack-toggle aria-label="Play soundtrack" aria-pressed="false">
      <span class="site-soundtrack-icon" data-soundtrack-icon aria-hidden="true">▶</span>
      <span class="site-soundtrack-copy">
        <span class="site-soundtrack-status" data-soundtrack-status>Play</span>
        <span class="site-soundtrack-title" data-soundtrack-title>Lovely Day, Good As Hell - Pomplamoose</span>
      </span>
    </button>
    <button class="site-soundtrack-next" type="button" data-soundtrack-next aria-label="Next song" title="Next song">
      <svg class="site-soundtrack-next-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M5.5 5.5 14 12l-8.5 6.5v-13Z"></path>
        <path d="M17.5 5.5v13"></path>
      </svg>
    </button>
  </div>

  <script src="js/site-shell.js"></script>
</body>
</html>
