    <!-- Photo viewer -->
    <div id="photoModal" class="photo-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button type="button" class="modal-button modal-nav modal-prev" id="modalPrev" aria-label="Previous photo">&#10094;</button>
        <div class="modal-inner">
            <div class="modal-toolbar">
                <button type="button" class="modal-button modal-close" id="modalCloseBtn" aria-label="Close photo">&times;</button>
            </div>
            <div class="modal-content-wrap">
                <img class="modal-content" id="modalImage" alt="Expanded photo">
            </div>
            <div class="modal-caption" id="modalCaption"></div>
        </div>
        <button type="button" class="modal-button modal-nav modal-next" id="modalNext" aria-label="Next photo">&#10095;</button>
