<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photography portfolio by Ryan.">
  <title>Photography — Ryan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="photo-page">
  <header class="site-header" data-site-header>
    <a class="brand" href="index.html">RYAN<span>.</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="siteNav" data-nav-toggle><span class="sr-only">Open navigation</span><span></span><span></span></button>
    <nav class="site-nav" id="siteNav" aria-label="Primary navigation" data-site-nav>
      <a href="index.html">Home</a>
      <a class="is-active" href="photography.html">Photography</a>
      <a href="music.html">Music</a>
      <a href="index.html#film">Film</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="page-intro container-wide">
      <p class="eyebrow">Photography</p>
      <h1>Moments worth <em>staying with.</em></h1>
      <div class="page-intro-row">
        <p>Click any photograph to enter the full-screen viewer. Use the arrow keys, drag with a mouse, or swipe on a phone to move through the entire collection.</p>
        <span class="photo-count" data-photo-count></span>
      </div>
    </section>

    <section class="gallery-shell container-wide" aria-label="Photography gallery">
      <div class="masonry-gallery" data-gallery>
        <!-- Gallery items are generated from js/photos.js so filenames only need to be maintained in one place. -->
      </div>
    </section>
  </main>

  <div class="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Photo viewer" data-lightbox>
    <div class="lightbox-topbar">
      <div class="lightbox-index" aria-live="polite" data-lightbox-index></div>
      <button class="icon-button" type="button" aria-label="Close photo viewer" data-lightbox-close>×</button>
    </div>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photo" data-lightbox-prev>‹</button>
    <div class="lightbox-stage" data-lightbox-stage>
      <div class="lightbox-slide lightbox-slide-prev" aria-hidden="true"><img alt=""></div>
      <div class="lightbox-slide lightbox-slide-current"><img data-lightbox-image alt=""></div>
      <div class="lightbox-slide lightbox-slide-next" aria-hidden="true"><img alt=""></div>
    </div>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photo" data-lightbox-next>›</button>
    <div class="lightbox-footer">
      <p data-lightbox-caption></p>
      <p class="lightbox-hint">Swipe, drag, or use ← →</p>
    </div>
  </div>

  <footer class="site-footer">
    <span>© <span data-year></span> Ryan</span>
    <span>Photography</span>
  </footer>
  <script src="js/photos.js"></script>
  <script src="js/portfolio.js"></script>
</body>
</html>
