  <style>
    /*
      Photography title — sequential focus reveal.

      All three words begin present but soft and out of focus.
      They resolve gently in sequence:
      Take -> a -> look.

      There is no mask, wipe, vertical edge, or horizontal movement.
    */

    .photo-page .photo-hero-title h1 {
      opacity: 1;
      filter: none;
      transform: none;
      animation: none !important;
    }

    .photo-page .photo-title-phrase {
      display: inline-block;
      transform-origin: 50% 42%;
      animation: photo-title-gentle-float 18.8s ease-in-out 2.85s infinite;
      will-change: transform;
    }

    .photo-page .photo-focus-word {
      display: inline-block;
      opacity: .10;
      filter: blur(8px);
      transform: none;
      will-change: opacity, filter;
    }

    /*
      The delays overlap slightly so the title feels like one calm progression
      rather than three isolated events.
    */
    .photo-page .photo-focus-word--take {
      animation: photo-focus-resolve 1.425s cubic-bezier(.22, .68, .24, 1) .20s forwards;
    }

    .photo-page .photo-focus-word--a {
      animation: photo-focus-resolve 1.375s cubic-bezier(.22, .68, .24, 1) 1.28s forwards;
    }

    .photo-page .photo-focus-word--look {
      animation: photo-focus-resolve 1.475s cubic-bezier(.22, .68, .24, 1) 2.04s forwards;
    }

    @keyframes photo-focus-resolve {
      from {
        opacity: .10;
        filter: blur(8px);
      }

      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    /*
      After the reveal completes, the whole phrase has one tiny suspended
      movement. The phrase moves together, not word-by-word.
    */
    @keyframes photo-title-gentle-float {
      0%, 100% {
        transform: rotate(0deg) translateY(0);
      }

      30% {
        transform: rotate(-.24deg) translateY(-.60px);
      }

      59% {
        transform: rotate(.21deg) translateY(.28px);
      }

      81% {
        transform: rotate(-.09deg) translateY(-.20px);
      }
    }

    /*
      LOOK begins as cool silver / steel.
      This base stays silver while the word itself resolves into focus.
    */
    .photo-page .photo-hero-accent {
      position: relative;
      display: inline-block;

      color: transparent;
      -webkit-text-fill-color: transparent;

      background:
        linear-gradient(
          105deg,
          #8f9aa1 0%,
          #dbe2e6 22%,
          #f4f7f8 38%,
          #aab5bc 53%,
          #e5ebee 71%,
          #9aa5ac 100%
        );
      background-size: 180% 100%;
      background-position: 12% 50%;
      -webkit-background-clip: text;
      background-clip: text;

      animation: none !important;
    }

    /*
      Once LOOK is largely in focus, the color treatment slowly fades over
      the silver base, then continues its existing red -> blue -> yellow drift.
    */
    .photo-page .photo-hero-accent::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;

      color: transparent;
      -webkit-text-fill-color: transparent;

      background:
        linear-gradient(
          105deg,
          #8f151c 0%,
          #d92d34 15%,
          #ff6651 27%,
          #436fbd 43%,
          #79a8dc 56%,
          #d5a42c 73%,
          #ffe28a 87%,
          #bd7f1d 100%
        );
      background-size: 300% 100%;
      background-position: 0% 50%;
      -webkit-background-clip: text;
      background-clip: text;

      opacity: 0;

      animation:
        photo-look-color-emerge 2.5s ease 2.325s forwards,
        photo-look-color-drift 22s ease-in-out 2.5s infinite alternate;
      will-change: opacity, background-position;
    }

    @keyframes photo-look-color-emerge {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes photo-look-color-drift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 18% 50%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-page .photo-title-phrase,
      .photo-page .photo-focus-word,
      .photo-page .photo-hero-accent::after {
        animation: none !important;
      }

      .photo-page .photo-title-phrase {
        transform: none;
      }

      .photo-page .photo-focus-word {
        opacity: 1;
        filter: none;
      }

      .photo-page .photo-hero-accent::after {
        opacity: 1;
        background-position: 50% 50%;
      }
    }
  </style>
</head>
<body class="photo-page photo-page-editorial">
  <header class="site-header" data-site-header>
    <a class="brand" href="index.html" aria-label="Ryan portfolio home">
      <span class="brand-mark">R</span><span class="brand-word">RYAN</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="siteNav" data-nav-toggle>
      <span class="sr-only">Open navigation</span><span></span><span></span>
    </button>
    <nav class="site-nav" id="siteNav" aria-label="Primary navigation" data-site-nav>

      <a class="is-active" href="photography.html">Photography</a>
      <a href="music.html">Music</a>
      <a href="index.html#film">Film</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="photo-hero-editorial container-wide">
      <div class="photo-hero-title">
        <p class="eyebrow">Photography / Archive</p>
        <h1 aria-label="Take a look">
          <span class="photo-title-phrase" aria-hidden="true">
            <span class="photo-focus-word photo-focus-word--take">Take</span>
            <span class="photo-focus-word photo-focus-word--a">a</span>
            <span class="photo-focus-word photo-focus-word--look"><span class="photo-hero-accent" data-text="look">look</span></span>
          </span>
        </h1>
      </div>
      <div class="photo-hero-copy">
        <p><p>Fragments of people, places, and stories.</p></p>
        <div class="photo-meta-line">
          <span data-photo-count>Photography archive</span>
        </div>
      </div>
    </section>

    <section class="photo-grid-section" aria-label="Photography gallery">
      <div class="photo-album-nav" data-album-nav aria-label="Photography collections"></div>

      <div class="photo-grid-bar">
        <span data-album-heading>All photographs</span>
        <div class="photo-grid-tools">
          <span data-gallery-status>Photographs</span>
        </div>
      </div>

      <!--
        photos.js remains your editable manifest. The "All" view uses a
        fresh randomized order each time the page is loaded.
        Named albums are virtual collections, so the image files can stay
        together in Images/photo-full/.
      -->
      <div class="photo-grid" id="photoGrid"></div>
    </section>
  </main>


  <div class="photo-viewer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Photo viewer" data-photo-viewer>
    <div class="photo-viewer-topbar">
      <span class="photo-viewer-brand">RYAN / PHOTOGRAPHY</span>
      <div class="photo-viewer-index" aria-live="polite" data-viewer-index></div>
      <div class="photo-viewer-actions">
        <span class="photo-viewer-detail-status" aria-live="polite" data-viewer-detail-status>Loading detail</span>
        <button class="photo-viewer-close" type="button" aria-label="Close photo viewer" data-viewer-close>×</button>
      </div>
    </div>

    <div class="photo-viewer-stage" data-viewer-stage>
      <img class="photo-viewer-image is-active" data-viewer-image-a alt="">
      <img class="photo-viewer-image" data-viewer-image-b alt="">
    </div>

    <div class="photo-viewer-nav-row" aria-label="Photo navigation">
      <button class="photo-viewer-nav photo-viewer-prev" type="button" aria-label="Previous photograph" data-viewer-prev>‹</button>
      <button class="photo-viewer-nav photo-viewer-next" type="button" aria-label="Next photograph" data-viewer-next>›</button>
    </div>

    <div class="photo-viewer-footer">
      <div class="photo-viewer-copy">
        <p class="photo-viewer-caption" data-viewer-caption></p>
        <p class="photo-viewer-meta" data-viewer-meta></p>
      </div>
      <div class="photo-viewer-variants" data-viewer-variants hidden aria-label="Alternate frames">
        <span class="photo-viewer-variants-label">Frame</span>
        <div class="photo-viewer-variant-buttons" data-viewer-variant-buttons></div>
      </div>
      <p class="photo-viewer-hint">Click to zoom/drag</p>
    </div>
  </div>
